name: Check packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - run: node scripts/check-inventory.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:npm
      - name: Check npm archives
        run: for dir in packages/npm/*; do (cd "$dir" && npm pack --dry-run --silent); done
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn --batch-mode test
      - run: mvn --batch-mode package -DskipTests
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/nuget-smoke/NugetSmoke.csproj -c Release
      - run: for project in packages/nuget/*/*.csproj; do dotnet pack "$project" -c Release --no-restore; done
  rubygems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: for dir in packages/rubygems/*; do (cd "$dir" && ruby -Ilib test/test.rb && gem build ./*.gemspec); done
