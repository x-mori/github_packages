name: Publish 52 packages
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-inventory.mjs
  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@x-mori'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:npm
      - run: for dir in packages/npm/*; do (cd "$dir" && npm publish); done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  maven:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: mvn --batch-mode test
      - run: for dir in packages/maven/*; do mvn --batch-mode -f "$dir/pom.xml" -DskipTests deploy; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  nuget:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/nuget-smoke/NugetSmoke.csproj -c Release
      - run: dotnet nuget add source "https://nuget.pkg.github.com/x_mori/index.json" --name github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" --store-password-in-clear-text
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: for project in packages/nuget/*/*.csproj; do dotnet pack "$project" -c Release -o "$RUNNER_TEMP/nupkg"; done
      - run: for archive in "$RUNNER_TEMP"/nupkg/*.nupkg; do dotnet nuget push "$archive" --source github --api-key "$GITHUB_TOKEN" --skip-duplicate; done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  rubygems:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: for dir in packages/rubygems/*; do (cd "$dir" && ruby -Ilib test/test.rb && gem build ./*.gemspec); done
      - run: mkdir -p "$HOME/.gem" && printf ':github: Bearer %s\n' "$GITHUB_TOKEN" > "$HOME/.gem/credentials" && chmod 600 "$HOME/.gem/credentials"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: for archive in packages/rubygems/*/*.gem; do gem push --key github --host https://rubygems.pkg.github.com/x-mori "$archive"; done
